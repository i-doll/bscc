[workspace]
resolver = "3"
members = [
    "crates/bscc-core",
    "crates/bscc-regex-tier",
    "crates/bscc-ast-tier",
    "crates/bscc-lang-rust",
    "crates/bscc-export",
    "crates/bscc-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
version = "0.0.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/i-doll/bscc"
authors = ["Amalthea Skydancer <five@th3a.dev>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
# core
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
rayon = "1"
memchr = "2"
once_cell = "1"

# CLI
clap = { version = "4", features = ["derive"] }
owo-colors = "4"

# config / data
toml = "0.8"

# tree-sitter
tree-sitter = "0.26"
tree-sitter-rust = "0.24"

# tests
insta = { version = "1", features = ["yaml", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
