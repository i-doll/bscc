# Regex-tier languages for bscc. Entries here serve as the fallback for any
# language not covered by a tree-sitter `bscc-lang-*` crate. When such a crate
# is also registered, its entry replaces the one defined here.
#
# Known limitation: the tokenizer does NOT support nested block comments, so
# languages like Haskell or OCaml may slightly miscount in deeply nested
# comment cases. This is acceptable for v0.1; tree-sitter crates for those
# languages would fix it.

# ────────── Systems / compiled ──────────

[[language]]
name = "Rust"
extensions = ["rs"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
strings = [["\"", "\""]]

[[language]]
name = "Go"
extensions = ["go"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
strings = [["\"", "\""], ["`", "`"]]

