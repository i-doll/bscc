# Regex-tier languages for bscc M1. Tree-sitter-enabled languages will move
# out of this file as their per-language crates land in M2/M3.

[[language]]
name = "Rust"
extensions = ["rs"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
strings = [["\"", "\""]]

[[language]]
name = "Python"
extensions = ["py", "pyi"]
line_comments = ["#"]
strings = [
    ["\"\"\"", "\"\"\""],
    ["'''", "'''"],
    ["\"", "\""],
    ["'", "'"],
]

[[language]]
name = "JavaScript"
extensions = ["js", "mjs", "cjs"]
line_comments = ["//"]
block_comments = [["/*", "*/"]]
strings = [["\"", "\""], ["'", "'"], ["`", "`"]]

