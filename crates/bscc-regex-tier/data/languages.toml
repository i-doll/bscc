# Regex-tier languages for bscc.
# Auto-converted from scc's languages.json (https://github.com/boyter/scc)
# plus bscc-specific additions (LSL, Git Config, Editor Config, JSX).
#
# Known limitation: the tokenizer does not support nested block comments,
# so languages with nestedmultiline=true (Haskell, OCaml, Swift, ...) may
# slightly miscount in deeply nested cases.

[[language]]
name = "ABAP"
extensions = ["abap"]
line_comments = ["*", "\\\""]

[[language]]
name = "ABNF"
extensions = ["abnf"]
line_comments = [";"]

